<main class="dashboard-layout">
    
    <aside class="sidebar viz-card">
        <h1><span>Monza 2024</span></h1>
        <h2>Analytics on Demand</h2>
        <div id="analytics-panel">
            <p>Seleziona i dati sulla PCA per aggiornare le statistiche.</p>
            </div>
    </aside>
    <div class="main-content">
        <!-- FIRST ROW-->
        <section class="dashboard-row">
            <div class="viz-card" id="view-a" style="flex: 0 0 50%;">
                <h2>Strategy Gantt</h2>
                <div id="gantt-chart" class="chart-container"></div>
            </div>
            <div class="viz-card" id="view-b" style="flex: 0 0 50%;">
                <h2>Lap Time Evolution</h2>
                <div id="line-chart" class="chart-container"></div>
            </div>

              
        </section>
        <!-- SECOND ROW-->
        <section class="dashboard-row">

            <div class="empty-space" style="flex: 0 0 50%;"></div>

            <div class="viz-card" id="view-c" style="flex: 0 0 50%;">
                <h2>PCA Stint Analysis</h2>
                <div id="pca-chart" class="chart-container"></div>
            </div>
            
            
        </section>
        <!-- THIRD ROW-->
        <section class="dashboard-row">
            <div class="viz-card" id="view-d" style="flex: 0 0 100%;">
                <h2>Parallel Coordinates</h2>
                <div id="pcp-chart" class="chart-container"></div>
            </div>
        </section>

    </div>


</main>

<div id="tooltip" class="tooltip hidden"></div>
